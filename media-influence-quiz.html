  </h1>
<!-- 🎯 Divider -->

      <div class="divider-bar">
        <div class="truth"></div>
        <div class="reliability"></div>

      </div>
      <div class="divider-labels">
        <span>Truth</span>

 <!-- 🦉 Strategic Owl Radicalization Quiz -->
<div id="quiz-container" class="container">

  <div style="
    background: linear-gradient(to bottom right, #1A2B4C, #0D1B2A);
    border: 1px solid var(--understanding);
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    padding: 24px;
    margin-bottom: 32px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
    color: #CCCCCC;
    font-family: 'Roboto', sans-serif;
    line-height: 1.6;
    font-size: 1rem;
    text-align: center;
  ">
    <p style="margin-bottom: 12px;">
      This tool measures civic alignment — not political views. It’s anonymous, quick, and reveals how your beliefs align with American values like liberty, civic duty, and equal justice.
    </p>
    <p style="margin-bottom: 0;">
      Answer honestly. This isn’t a test — it’s a mirror.
    </p>
  </div>

  <div id="quiz-question" style="margin-top: 40px; text-align: center;"></div>

  <!-- Inline narrative response area -->
  <div id="narrative-display" style="max-width: 600px; margin: 0 auto; padding: 20px; display: none; background-color: var(--surface); color: var(--text); border-left: 4px solid var(--reliability); border-radius: 8px; font-size: 1rem; font-family: 'Inter', sans-serif;"></div>

  <!-- "Next" button shown AFTER delay -->
  <button id="next-question" style="
  display: none;
  margin: 20px auto 0;
  background-color: transparent;
  color: var(--understanding);
  padding: 10px 24px;
  border: 2px solid var(--understanding);
  border-radius: 10px;
  font-size: 1rem;
  font-family: 'Montserrat', sans-serif;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
" onmouseover="this.style.backgroundColor='var(--understanding)'; this.style.color='var(--navy)';"
  onmouseout="this.style.backgroundColor='transparent'; this.style.color='var(--understanding)';">
  Yes. Continue →
</button>
