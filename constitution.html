<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Library | The Strategic Owl</title>
  <meta name="description" content="Read America's founding documents, landmark cases, civic texts, and the arguments that shaped public life." />
  <link rel="canonical" href="https://thestrategicowl.com/constitution.html" />
  <link rel="icon" type="image/png" href="assets/images/3X.png" />
  <link rel="stylesheet" href="assets/css/site.css?v=20261028-1" />
  <link rel="stylesheet" href="assets/css/pages/constitution.css?v=20261029-1" />
  <script src="assets/js/site-shell.js?v=20261028-1" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/owl-access.js?v=20261028-1" defer></script>
  <script src="assets/js/pages/constitution.js?v=20261029-1" defer></script>
</head>
<body class="site-body" data-page="constitution">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-header"></div>

  <main id="main-content" class="site-page library-page" tabindex="-1">
    <section class="library-hero" aria-labelledby="library-title">
      <div class="library-brand-lockup" aria-hidden="true">
        <img src="assets/images/owl-mark.png" alt="" />
        <span>STRATEGIC OWL LIBRARY</span>
      </div>
      <h1 id="library-title">Read the source</h1>
      <p>Founding documents, landmark cases, and the public arguments that shaped American civic life.</p>

      <label class="library-search" for="library-search-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.7-4.7m2.2-5.3a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" /></svg>
        <input id="library-search-input" type="search" autocomplete="off" placeholder="Search the founding library" />
      </label>
    </section>

    <section class="library-shell" aria-live="polite" aria-busy="true">
      <nav id="library-breadcrumbs" class="library-breadcrumbs" aria-label="Library location" hidden></nav>
      <div id="library-content" class="library-content">
        <div class="library-loading">
          <span class="library-loading-mark" aria-hidden="true">S</span>
          <strong>Opening the Library</strong>
          <span>Preparing the complete civic collection.</span>
        </div>
      </div>
    </section>

    <aside id="library-player" class="library-player" hidden>
    <div class="library-player__summary">
      <img src="assets/images/owl-mark.png" alt="" />
      <button id="library-player-toggle" class="library-player__title" type="button" aria-expanded="true">
        <strong id="library-player-title">Library audio</strong>
        <span id="library-player-subtitle">Civic Owl conversation</span>
      </button>
      <button id="library-player-collapse" class="library-player__icon" type="button" aria-label="Collapse audio controls">⌃</button>
      <button id="library-player-close" class="library-player__icon" type="button" aria-label="Close audio player">×</button>
    </div>
    <div id="library-player-controls" class="library-player__controls">
      <input id="library-player-progress" type="range" min="0" max="100" value="0" aria-label="Audio progress" />
      <div class="library-player__buttons">
        <span id="library-player-current">0:00</span>
        <button id="library-player-back" type="button" aria-label="Go back 15 seconds">↶<small>15</small></button>
        <button id="library-player-play" class="library-player__play" type="button" aria-label="Play">▶</button>
        <button id="library-player-forward" type="button" aria-label="Go forward 15 seconds">↷<small>15</small></button>
        <span id="library-player-duration">0:00</span>
      </div>
    </div>
    </aside>
  </main>

  <div id="site-footer"></div>
</body>
</html>
